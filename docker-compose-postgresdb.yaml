services:
  order-postgres:
    container_name: order-db
    image: postgres:15-alpine
    env_file: .env
    environment:
      - POSTGRES_DB=innowise_order_service_db
      - POSTGRES_USER=order_user
      - POSTGRES_PASSWORD=order_pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d innowise_order_service_db"]
      interval: 5s
      timeout: 5s
      retries: 3
volumes:
  postgres_data: