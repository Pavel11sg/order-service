name: CI Pipeline for order-service

on:
  pull_request:
    branches: [ master, order-service ]
  workflow_dispatch:

env:
  IMAGE_NAME: order-service
  POSTGRES_DB: innowise_order_service_db

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean compile -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: |
          mvn test
          mvn jacoco:report
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ env.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_LIQUIBASE_URL: jdbc:postgresql://localhost:5432/${{ env.POSTGRES_DB }}
          SPRING_LIQUIBASE_USER: ${{ secrets.POSTGRES_USER }}
          SPRING_LIQUIBASE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml

      - name: Debug - List target directory contents
        run: |
          echo "Listing target directory:"
          find target/ -name "*.xml" | head -10
          echo "Listing site/jacoco directory:"
          ls -la target/site/jacoco/ || echo "site/jacoco directory does not exist yet"

  code-analysis:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Verify coverage report exists
        run: |
          echo "Checking jacoco.xml location:"
          find . -name "jacoco.xml" -type f
          echo "Contents of target/site/jacoco/:"
          ls -la target/site/jacoco/ || echo "target/site/jacoco/ does not exist"
          echo "Current directory structure:"
          ls -la

      - name: Recreate jacoco directory structure if needed
        run: |
          # Ensure the jacoco directory exists with the correct structure
          mkdir -p target/site/jacoco/
          # Move the downloaded jacoco.xml to the correct location if it's elsewhere
          if [ -f "jacoco.xml" ]; then
            mv jacoco.xml target/site/jacoco/jacoco.xml
          fi
          # Verify the file is in the correct location
          ls -la target/site/jacoco/

      - name: Compile code for SonarQube analysis
        run: mvn compile -DskipTests

      - name: Run SonarQube analysis with Maven
        id: sonar-analysis
        if: github.event_name == 'pull_request'
        run: |
          # First verify the jacoco file exists in the expected location
          if [ -f "target/site/jacoco/jacoco.xml" ]; then
            echo "JaCoCo report found at target/site/jacoco/jacoco.xml"
            mvn sonar:sonar \
              -Dsonar.organization=innowise-internship \
              -Dsonar.projectKey=Pavel11sg_order-service \
              -Dsonar.projectName=order-service \
              -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
              -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
              -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          else
            echo "ERROR: JaCoCo report not found at target/site/jacoco/jacoco.xml"
            echo "Available files:"
            find . -name "*.xml"
            exit 1
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Verify SonarQube report files
        if: github.event_name == 'pull_request'
        run: |
          echo "Checking for SonarQube report files:"
          ls -la .scannerwork/ || echo ".scannerwork directory does not exist"
          if [ -f ".scannerwork/report-task.txt" ]; then
            echo "report-task.txt content:"
            cat .scannerwork/report-task.txt
          else
            echo "report-task.txt not found in .scannerwork/"
            echo "Available files in .scannerwork/:"
            ls -la .scannerwork/ 2>/dev/null || echo "No .scannerwork directory"
          fi

      - name: Check SonarQube Quality Gate status
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run Checkstyle
        run: mvn checkstyle:check

  build-docker-image:
    runs-on: ubuntu-latest
    needs: [test, code-analysis]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max