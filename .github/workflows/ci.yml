name: CI Pipeline for order-service

on:
  pull_request:
    branches: [ master, order-service ]
  push:
      branches: [ master, order-service ]
  workflow_dispatch:

env:
  IMAGE_NAME: order-service
  POSTGRES_DB: innowise_order_service_db

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean compile -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with coverage
        run: |
          mvn test
          mvn jacoco:report
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ env.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SPRING_LIQUIBASE_URL: jdbc:postgresql://localhost:5432/${{ env.POSTGRES_DB }}
          SPRING_LIQUIBASE_USER: ${{ secrets.POSTGRES_USER }}
          SPRING_LIQUIBASE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml

  sonarqube:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.event_name == 'push')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: ./

      - name: Compile project first (without clean)
        run: mvn compile -DskipTests

      - name: Move jacoco.xml to correct location
        run: |
          # Create the target directory structure
          mkdir -p target/site/jacoco/

          # Find and move the jacoco.xml file
          JACOCO_FILE=$(find . -name "jacoco.xml" -type f | head -1)
          if [ -n "$JACOCO_FILE" ]; then
            echo "Found jacoco.xml at: $JACOCO_FILE"
            mv "$JACOCO_FILE" target/site/jacoco/jacoco.xml
            echo "Moved to target/site/jacoco/jacoco.xml"
          else
            echo "ERROR: jacoco.xml not found anywhere!"
            exit 1
          fi

          echo "Verifying the file is in correct location:"
          ls -la target/site/jacoco/jacoco.xml

      - name: Verify target directory
        run: ls -la target/classes/

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Jacoco file details:"
          ls -la target/site/jacoco/jacoco.xml

          # Run SonarQube analysis with detailed output
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:3.11.0.3922:sonar \
            -Dsonar.organization=innowise-internship \
            -Dsonar.projectKey=Pavel11sg_order-service \
            -Dsonar.projectName=order-service \
            -Dsonar.java.source=21 \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.junit.reportPaths=target/surefire-reports \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.verbose=true

  build-docker-image:
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/order-service')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max