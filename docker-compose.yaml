services:
  order-service:
    container_name: order-service-container
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    ports:
      - "8083:8083"
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-service-postgres:5432/orderdb
      - SPRING_DATASOURCE_USERNAME=order_user
      - SPRING_DATASOURCE_PASSWORD=order_pass
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://order-service-postgres:5432/orderdb
      - SPRING_LIQUIBASE_USER=order_user
      - SPRING_LIQUIBASE_PASSWORD=order_pass
    depends_on:
      order-service-postgres:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL and Kafka to be ready...'
        while ! nc -z order-service-postgres 5432; do sleep 2; done
        while ! nc -z kafka 9093; do sleep 2; done
        echo 'All dependencies ready, starting application...'
        java -jar /app/order-service.jar
      "
    networks:
      - app-shared-network

  order-service-postgres:
    container_name: order-service-db
    image: postgres:15-alpine
    env_file: .env
    environment:
      - POSTGRES_DB=orderdb
      - POSTGRES_USER=order_user
      - POSTGRES_PASSWORD=order_pass
    ports:
      - "5435:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app-shared-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: payment-service-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://kafka:9091,PLAINTEXT_HOST://kafka:9092,PLAINTEXT_DOCKER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-shared-network

networks:
  app-shared-network:
    external: true

volumes:
  order_service_postgres_data: