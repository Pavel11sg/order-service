services:
  order-service:
    container_name: order-service-container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_LIQUIBASE_URL=${SPRING_LIQUIBASE_URL}
      - SPRING_LIQUIBASE_USER=${SPRING_LIQUIBASE_USER}
      - SPRING_LIQUIBASE_PASSWORD=${SPRING_LIQUIBASE_PASSWORD}
    depends_on:
      - order-service-postgres
    networks:
      - app-shared-network

  order-service-postgres:
    container_name: order-service-db
    image: postgres:15-alpine
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - order_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innowise_order_service_db"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - app-shared-network

networks:
  app-shared-network:
    external: true

volumes:
  order_service_postgres_data: