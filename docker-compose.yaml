services:
  postgres:
    image: postgres:15-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: innowise_order_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innowise_order_service_db"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: